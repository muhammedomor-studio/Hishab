name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # এই অপশনটি থাকলে গিটহাব থেকে সরাসরি ম্যানুয়ালি বিল্ড চালু করতে পারবেন

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      # ১. কোড ক্লোন করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. জাভা ১৭ (JDK 17) সেটআপ করা
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ৩. Gradle স্ক্রিপ্ট রান করার পারমিশন দেওয়া
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ৪. APK বিল্ড কমান্ড রান করা
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # ৫. তৈরি হওয়া APK ফাইলটি Artifacts হিসেবে আপলোড করা
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Expense-Tracker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7